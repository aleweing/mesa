<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mesa</title>
  <meta name="theme-color" content="#20261F" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Config: primera vez que se abre, pide la URL del Worker y la clave -->
    <div id="view-config" class="view hidden">
      <div class="config-box">
        <h1 class="brand">Mesa<span class="brand-dot">.</span></h1>
        <p class="muted">Tu cuaderno personal de restaurantes.</p>
        <label class="field">
          <span>URL de tu API (Cloudflare Worker)</span>
          <input type="url" id="cfg-url" placeholder="https://mesa-api.tuusuario.workers.dev" />
        </label>
        <label class="field">
          <span>Clave de acceso</span>
          <input type="password" id="cfg-key" placeholder="Tu clave privada" />
        </label>
        <button class="btn-primary" id="cfg-save">Guardar y entrar</button>
      </div>
    </div>

    <!-- Lista -->
    <div id="view-list" class="view hidden">
      <header class="topbar">
        <h1 class="brand">Mesa<span class="brand-dot">.</span></h1>
        <button class="icon-btn" id="open-settings" aria-label="Ajustes">⚙</button>
      </header>

      <div id="list-empty" class="empty hidden">
        <p class="empty-title">Aún no hay ninguna mesa apuntada</p>
        <p class="muted">Toca “+” cuando vuelvas de tu próximo restaurante.</p>
      </div>

      <ul id="restaurant-list" class="ticket-list"></ul>

      <button class="fab" id="fab-add" aria-label="Añadir restaurante">+</button>
    </div>

    <!-- Detalle -->
    <div id="view-detail" class="view hidden">
      <header class="topbar">
        <button class="icon-btn" id="back-from-detail" aria-label="Volver">←</button>
        <div class="topbar-actions">
          <button class="icon-btn" id="edit-restaurant" aria-label="Editar">✎</button>
          <button class="icon-btn" id="delete-restaurant" aria-label="Eliminar">🗑</button>
        </div>
      </header>

      <div class="detail-body">
        <span id="detail-owner-tag" class="owner-tag hidden"></span>
        <h2 id="detail-name" class="restaurant-name"></h2>
        <a id="detail-address" class="link-row" target="_blank" rel="noopener"></a>
        <a id="detail-phone" class="link-row" href="#"></a>
        <p id="detail-notes" class="notes hidden"></p>

        <div class="divider"></div>

        <h3 class="section-label">Platos</h3>
        <ul id="dish-list" class="dish-list"></ul>
        <button class="btn-ghost" id="add-dish">+ Añadir plato</button>

        <div class="divider"></div>

        <h3 class="section-label">Fotos generales (fachada…)</h3>
        <div id="photos-general" class="photo-strip"></div>
        <label class="btn-ghost upload-label">
          + Añadir foto
          <input type="file" id="photo-input-general" accept="image/*" capture="environment" multiple hidden />
        </label>

        <h3 class="section-label photo-section-spaced">Menús</h3>
        <div id="photos-menu" class="photo-strip"></div>
        <label class="btn-ghost upload-label">
          + Añadir foto de menú
          <input type="file" id="photo-input-menu" accept="image/*" capture="environment" multiple hidden />
        </label>

        <h3 class="section-label photo-section-spaced">Tickets</h3>
        <div id="photos-ticket" class="photo-strip"></div>
        <label class="btn-ghost upload-label">
          + Añadir foto de ticket
          <input type="file" id="photo-input-ticket" accept="image/*" capture="environment" multiple hidden />
        </label>

        <input type="file" id="dish-photo-input" accept="image/*" capture="environment" hidden />
      </div>
    </div>

    <!-- Formulario restaurante (crear/editar) -->
    <div id="view-form" class="view hidden">
      <header class="topbar">
        <button class="icon-btn" id="back-from-form" aria-label="Cancelar">←</button>
        <h2 id="form-title" class="form-title">Nueva mesa</h2>
        <button class="icon-btn" id="save-restaurant" aria-label="Guardar">✓</button>
      </header>
      <div class="detail-body">
        <label class="field">
          <span>Nombre *</span>
          <input type="text" id="form-name" placeholder="Ej. Ca'n Pep" />
        </label>
        <label class="field">
          <span>Dirección</span>
          <input type="text" id="form-address" placeholder="Calle, ciudad" />
        </label>
        <label class="field">
          <span>Teléfono</span>
          <input type="tel" id="form-phone" placeholder="Para reservar" />
        </label>
        <label class="field">
          <span>Notas generales</span>
          <textarea id="form-notes" rows="3" placeholder="Para mi hija: solo arroz con pollo…"></textarea>
        </label>
        <label class="field-toggle">
          <input type="checkbox" id="form-shared" />
          <span>Compartir con el otro usuario</span>
        </label>
      </div>
    </div>

  </div>

  <div id="photo-viewer" class="photo-viewer hidden">
    <button class="pv-close" id="pv-close" aria-label="Cerrar">✕</button>
    <button class="pv-nav pv-prev" id="pv-prev" aria-label="Anterior">‹</button>
    <img id="pv-image" alt="" />
    <button class="pv-nav pv-next" id="pv-next" aria-label="Siguiente">›</button>
    <div class="pv-actions">
      <button class="pv-assign" id="pv-assign">🍽 Usar en un plato</button>
      <button class="pv-assign" id="pv-category">📋 Categoría</button>
      <button class="pv-delete" id="pv-delete">🗑 Eliminar</button>
    </div>
    <div id="pv-dish-picker" class="pv-dish-picker hidden">
      <select id="pv-dish-select"></select>
      <button class="btn-primary" id="pv-dish-confirm">Asignar</button>
      <button class="btn-ghost" id="pv-dish-cancel">Cancelar</button>
    </div>
    <div id="pv-category-picker" class="pv-dish-picker hidden">
      <select id="pv-category-select">
        <option value="">General (fachada, otras…)</option>
        <option value="menu">Menú</option>
        <option value="ticket">Ticket</option>
      </select>
      <button class="btn-primary" id="pv-category-confirm">Guardar</button>
      <button class="btn-ghost" id="pv-category-cancel">Cancelar</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
